sonar.projectKey=grebla-app
sonar.projectName=grebla-app
# Instancia local (karajan-sonarqube). El token NO va aquí: se pasa en el scan
# (npx @sonar/scan -Dsonar.token=***) o vía la variable de entorno SONAR_TOKEN.
sonar.host.url=http://localhost:9000

# functions/ es código de producción y se analiza como tal: quedaba fuera y sus
# Cloud Functions nunca pasaron por el análisis (RMR-TSK-0503).
sonar.sources=src,functions,e2e,playwright.config.js
sonar.tests=src,functions,e2e
sonar.test.inclusions=**/*.test.js,**/*.spec.js
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,functions/node_modules/**,functions/lib/**

# Cobertura de Vitest (pnpm test:coverage → coverage/lcov.info)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Los módulos de DATOS curados (islas, rutas por rol) son estructuralmente
# repetitivos por naturaleza: fuera del detector de duplicación (no de análisis).
sonar.cpd.exclusions=src/tools/career/data/**

# S3358 (ternarios anidados) se ignora a propósito, sustituida por el guard
# src/nested-ternaries.test.js, que aplica NUESTRO criterio (RMR-TSK-0450).
#
# Por qué: medido sobre el repo, de 225 ternarios dentro de otro ternario, 153
# estaban dentro de un template —la pluralización `${n === 1 ? '' : 'es'}`, que
# los `${}` ya aíslan— y 68 eran una cadena en la rama «:», que se lee de arriba
# abajo como un if / else if. Solo 2 colgaban de la rama «?», que es el único
# caso en el que hay que emparejar qué «:» cierra qué. La regla acertaba el 1,8 %:
# 223 avisos de ruido enseñan a ignorar los avisos que sí valen.
#
# El guard cubre ese 1,8 % y no marca el resto, con tests de las dos cosas.
#
# S7785 (preferir top-level await a llamar una función async) se ignora SOLO en
# src/client/layout.js, y solo ahí porque la regla presupone algo que en un
# punto de entrada es falso: que esperar no cuesta nada. Ese módulo arranca el
# layout de todas las páginas y lo último que hace es pedir el logo de la
# instancia a Firestore. Con `await` de nivel superior, la evaluación del módulo
# —y la de cualquiera que lo importe— queda pendiente de una lectura de red que
# no es crítica: si el logo tarda, tarda el arranque. Soltar la promesa a
# propósito es aquí la decisión correcta, no un descuido; el `catch` ya está
# dentro, donde se sabe qué significa fallar (RMR-BUG-0135).
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S3358
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S7785
sonar.issue.ignore.multicriteria.e2.resourceKey=src/client/layout.js
